<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SKÖRD plant care journal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SKÖRD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SKÖRD</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #171A1A;
      color: #E8E6E3;
      font-family: system-ui, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 0;
      pointer-events: none;
    }
    /* Make Flutter semantics placeholder visible and clickable */
    flt-semantics-placeholder {
      position: fixed !important;
      top: 8px !important;
      left: 8px !important;
      width: auto !important;
      height: auto !important;
      z-index: 99999 !important;
    }
    flt-semantics-placeholder button {
      padding: 8px 16px !important;
      font-size: 14px !important;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>SKÖRD</div>
    <div style="opacity:0.7;font-size:14px">Loading…</div>
  </div>
  <script>
    // Hide loading screen once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
